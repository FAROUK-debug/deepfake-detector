name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The 167 MB model is cached, so the release file is downloaded only when its hash changes.
      - uses: actions/cache@v6
        with:
          path: models
          key: model-${{ hashFiles('detector.py') }}
      - run: python -c "import detector; detector.ensure_model()"
      - run: pytest -q
